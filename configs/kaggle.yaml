# =====================================================================
# Kaggle cloud-run config — inherits base.yaml, trimmed for a FIRST
# end-to-end validation run (fewer epochs so we confirm the whole
# train -> infer -> submit pipeline works on Kaggle GPU before we
# spend a long training budget).
# =====================================================================
_base_: base.yaml

training:
  epochs: 30            # quick validation run; bump to 60+ for the real attempt
  batch_size: 4         # mit_b5 @ 512 crops on T4 (x2) is GPU-safe

model:
  encoder: "mit_b5"

experiment:
  name: "filament_mit_b5_kaggle"
